<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiTEA — Vínculos do Cuidador</title>
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lumitea.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/enhance.css"><!--lt-enhance-->
  <script src="js/core/icons.js" defer></script>
  <script src="js/core/reveal.js" defer></script>
  <script src="js/core/ui.js" defer></script>
  <script src="js/core/alerta-critico.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/core/secrets.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/tema.js" defer></script>
  <!-- SEM defer de propósito: o bloco de script no fim do body desta página roda
       durante o parse e já usa CUI. Com defer, a casca só existiria depois. -->
  <script src="js/core/cuidador-shell.js"></script>
</head>
<body class="app-body lt-pro cui-page" data-cui-pagina="vinculos">

  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Topo mobile, gaveta e sidebar vêm da casca:
       js/core/cuidador-shell.js (o menu vive num arquivo só). -->
  <div class="cui-layout">
    <div class="cui-main">

      <div class="cui-tela ativa">
        <div class="cui-section-title"><i class="lt-i" data-lt-icon="link" aria-hidden="true"></i> Vínculos</div>
        <div class="cui-vinculo-box">
          <p class="cui-hint">Adolescentes vinculados à sua conta:</p>
          <div id="vinculo-teens-list"><div class="empty-state"><i class="lt-i" data-lt-icon="link" aria-hidden="true"></i><p>Carregando...</p></div></div>
          <hr class="cui-sep">
          <p class="cui-vinculo-titulo">Adicionar adolescente pelo código de vínculo:</p>
          <div class="vinculo-input-row">
            <input type="text" id="inp-codigo-cuidador" maxlength="6" placeholder="CÓDIGO (6 dígitos)" aria-label="Código de vínculo">
            <button class="btn-primary" id="btn-conectar">Conectar</button>
          </div>
          <div class="err-msg" id="err-vinculo-cuidador">Código inválido. Verifique com o adolescente.</div>
        </div>
      </div>

    </div><!-- /cui-main -->
  </div><!-- /cui-layout -->

  <script>
    /* A lista de vinculados já é carregada pela casca (CUI.teens) — esta página
       só a desenha. Depois de conectar/encerrar, chama CUI.recarregarTeens()
       pra a casca e o seletor das outras páginas ficarem em dia. */
    function renderVinculos() {
      var lista = document.getElementById('vinculo-teens-list');
      if (!lista) return;

      if (!CUI.teens.length) {
        lista.innerHTML = CUI.vazio('users', 'Nenhum adolescente vinculado ainda. Solicite o código de vínculo ao adolescente.');
        return;
      }

      lista.innerHTML = '';
      CUI.teens.forEach(function (teen) {
        var card = document.createElement('div');
        card.className = 'vinculo-teen-card';
        card.innerHTML =
          '<div class="vinculo-teen-av">' + CUI.ic('user') + '</div>' +
          '<div class="vinculo-teen-info">' +
            '<div class="vinculo-teen-nome">' + CUI.esc(teen.nome) + '</div>' +
            '<div class="vinculo-teen-meta">Nível ' + CUI.esc(teen.nivel) + ' • ' + CUI.esc(teen.xp) + ' XP</div>' +
          '</div>' +
          '<div class="vinculo-teen-actions"><span class="vinculo-status">' + CUI.ic('check') + ' Vinculado</span></div>';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vinculo-teen-suspender';
        btn.innerHTML = CUI.ic('x') + ' Encerrar vínculo';
        btn.addEventListener('click', function () { suspenderVinculo(teen.id, teen.nome); });
        card.querySelector('.vinculo-teen-actions').appendChild(btn);

        lista.appendChild(card);
      });
    }

    async function aceitarVinculoCuidador() {
      var inp = document.getElementById('inp-codigo-cuidador');
      var err = document.getElementById('err-vinculo-cuidador');
      var codigo = (inp.value || '').trim().toUpperCase();
      if (!codigo || codigo.length < 4) { err.classList.add('on'); return; }
      err.classList.remove('on');

      var r = await CUI.sb.rpc('aceitar_vinculo', { p_codigo: codigo });
      if (r.error || r.data !== 'ok') {
        console.error('[vinculos] aceitar_vinculo não retornou ok — data:', r.data, 'error:', r.error, 'uid usado:', CUI.uid);
        var msg = r.data === 'codigo_invalido' ? 'Código inválido.'
          : r.data === 'ja_vinculado' ? 'Este adolescente já tem um cuidador.'
          : r.data === 'tipo_invalido' ? 'Sua conta não tem permissão para vincular adolescentes.'
          : r.error ? ('Erro ao vincular: ' + (r.error.message || r.error.code || 'desconhecido')) : 'Erro ao vincular. Tente novamente.';
        err.textContent = msg; err.classList.add('on');
        return;
      }

      inp.value = '';
      await CUI.recarregarTeens();
    }

    async function suspenderVinculo(teenId, nomeTeen) {
      var ok = await LumiUI.confirm(
        'Isso vai desconectar ' + (nomeTeen || 'o adolescente') + ' da sua conta. Para se reconectar depois, ele(a) vai precisar compartilhar um novo código de vínculo com você.',
        { titulo: 'Encerrar vínculo?', ok: 'Encerrar vínculo', cancelar: 'Cancelar' }
      );
      if (!ok) return;

      var r = await CUI.sb.rpc('suspender_vinculo', { p_teen_id: teenId });
      if (r.error || r.data !== 'ok') {
        LumiUI.toast('Não foi possível encerrar o vínculo. Tente novamente.', { type: 'error' });
        return;
      }

      LumiUI.toast('Vínculo encerrado.', { type: 'success' });
      await CUI.recarregarTeens();
    }

    CUI.aoTrocarTeen(renderVinculos);

    document.addEventListener('DOMContentLoaded', function () {
      var inp = document.getElementById('inp-codigo-cuidador');
      inp.addEventListener('input', function () { inp.value = inp.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 6); });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') aceitarVinculoCuidador(); });
      document.getElementById('btn-conectar').addEventListener('click', aceitarVinculoCuidador);
    });
  </script>
</body>
</html>

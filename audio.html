<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiTEA — Conversa por Voz</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/core/secrets.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/lumi-ia.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,191,72,.35), transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(190,74,29,.25), transparent 55%),
        linear-gradient(180deg, #fff7e8 0%, #fce0b8 100%);
      min-height: 100vh;
      color: #4a2e10;
      display: flex;
      flex-direction: column;
    }

    /* ====== TOPBAR ====== */
    .topbar {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(190,74,29,.15);
    }
    .topbar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      color: #4a2e10;
      text-decoration: none;
    }
    .topbar .logo img { width: 36px; height: 36px; }

    .btn-back {
      background: rgba(255,255,255,0.7);
      border: 2px solid #be4a1d;
      color: #be4a1d;
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      font-size: .92rem;
      text-decoration: none;
      transition: all .2s;
    }
    .btn-back:hover { background: #be4a1d; color: #fff; }

    /* ====== MAIN GRID ====== */
    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto;
      gap: 18px;
      padding: 28px 24px 48px;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .titulo {
      font-family: 'Baloo 2', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      margin: 0;
      color: #4a2e10;
    }

    .subtitulo {
      font-size: clamp(.9rem, 2vw, 1rem);
      color: #7a4f25;
      margin: 0;
      max-width: 520px;
      line-height: 1.55;
    }

    /* ====== LOADER (BOLA) — em container isolado ====== */
    .ball-wrap {
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 4px 0;
    }

    .loader {
      --color-one: #ffbf48;
      --color-two: #be4a1d;
      --color-three: #ffbf4780;
      --color-four: #bf4a1d80;
      --color-five: #ffbf4740;
      --time-animation: 2s;
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      transform: scale(1.6);
      box-shadow:
        0 0 25px 0 var(--color-three),
        0 20px 50px 0 var(--color-four);
      animation: colorize calc(var(--time-animation) * 3) ease-in-out infinite;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .loader.idle     { transform: scale(1.4); }
    .loader.gravando {
      transform: scale(1.7);
      --color-two: #d22e1d;
      animation-duration: .9s;
    }
    .loader.pensando { transform: scale(1.5); animation-duration: 1.4s; }
    .loader.falando  {
      transform: scale(1.65);
      animation-duration: 1s;
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border-top: solid 1px var(--color-one);
      border-bottom: solid 1px var(--color-two);
      background: linear-gradient(180deg, var(--color-five), var(--color-four));
      box-shadow:
        inset 0 10px 10px 0 var(--color-three),
        inset 0 -10px 10px 0 var(--color-four);
    }
    .loader .box {
      width: 100px;
      height: 100px;
      background: linear-gradient(180deg, var(--color-one) 30%, var(--color-two) 70%);
      mask: url(#clipping);
      -webkit-mask: url(#clipping);
    }
    .loader svg { position: absolute; inset: 0; }
    .loader svg #clipping { filter: contrast(15); animation: roundness calc(var(--time-animation) / 2) linear infinite; }
    .loader svg #clipping polygon { filter: blur(7px); }
    .loader svg #clipping polygon:nth-child(1) { transform-origin: 75% 25%; transform: rotate(90deg); }
    .loader svg #clipping polygon:nth-child(2) { transform-origin: 50% 50%; animation: rotation var(--time-animation) linear infinite reverse; }
    .loader svg #clipping polygon:nth-child(3) { transform-origin: 50% 60%; animation: rotation var(--time-animation) linear infinite; animation-delay: calc(var(--time-animation) / -3); }
    .loader svg #clipping polygon:nth-child(4) { transform-origin: 40% 40%; animation: rotation var(--time-animation) linear infinite reverse; }
    .loader svg #clipping polygon:nth-child(5) { transform-origin: 40% 40%; animation: rotation var(--time-animation) linear infinite reverse; animation-delay: calc(var(--time-animation) / -2); }
    .loader svg #clipping polygon:nth-child(6) { transform-origin: 60% 40%; animation: rotation var(--time-animation) linear infinite; }
    .loader svg #clipping polygon:nth-child(7) { transform-origin: 60% 40%; animation: rotation var(--time-animation) linear infinite; animation-delay: calc(var(--time-animation) / -1.5); }

    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes roundness {
      0% { filter: contrast(15); }
      20%, 40% { filter: contrast(3); }
      60%, 100% { filter: contrast(15); }
    }
    @keyframes colorize {
      0%   { filter: hue-rotate(0deg); }
      20%  { filter: hue-rotate(-30deg); }
      40%  { filter: hue-rotate(-60deg); }
      60%  { filter: hue-rotate(-90deg); }
      80%  { filter: hue-rotate(-45deg); }
      100% { filter: hue-rotate(0deg); }
    }

    /* ====== STATUS BADGE ====== */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
      font-weight: 700;
      color: #be4a1d;
      font-size: .92rem;
      box-shadow: 0 4px 14px rgba(190,74,29,.12);
      min-height: 40px;
      max-width: 90%;
    }
    .status .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #be4a1d;
    }
    .status.gravando .dot { background: #d22e1d; animation: pulse 1s ease-in-out infinite; }
    .status.pensando .dot { background: #ffbf48; animation: pulse 1.2s ease-in-out infinite; }
    .status.falando .dot { background: #87e9b8; animation: pulse .8s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.4); opacity: .6; }
    }

    /* ====== CONTROLES ====== */
    .controles {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.85);
      border: 2px solid #be4a1d;
      color: #be4a1d;
      font-family: inherit;
      font-weight: 700;
      font-size: .95rem;
      padding: 11px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn:hover:not(:disabled) {
      background: #be4a1d;
      color: #fff;
      transform: translateY(-1px);
    }
    .ctrl-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .ctrl-btn.primary {
      background: linear-gradient(135deg, #ffbf48 0%, #be4a1d 100%);
      color: #fff;
      border-color: transparent;
      padding: 13px 26px;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(190,74,29,.3);
    }
    .ctrl-btn.primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(190,74,29,.4);
    }

    /* ====== TRANSCRIÇÃO ====== */
    .transcricao {
      width: 100%;
      max-width: 600px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.75);
      border-radius: 18px;
      font-size: .92rem;
      color: #4a2e10;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 4px 18px rgba(190,74,29,.12);
      min-height: 60px;
      text-align: left;
    }
    .transcricao .linha { margin-bottom: 10px; line-height: 1.5; }
    .transcricao .linha:last-child { margin-bottom: 0; }
    .transcricao .linha b { color: #be4a1d; font-weight: 800; }
    .transcricao .linha.lumi { background: rgba(255,191,72,.18); padding: 6px 10px; border-radius: 8px; }
    .transcricao:empty::before {
      content: 'A conversa vai aparecer aqui...';
      color: #a87a4d;
      font-style: italic;
      font-size: .88rem;
    }

    @media (max-width: 600px) {
      .stage { padding: 20px 16px 36px; gap: 14px; }
      .ball-wrap { width: 200px; height: 200px; }
    }
  </style>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/enhance.css"><!--lt-enhance-->
  <script src="js/core/icons.js" defer></script>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="conversa.html">
      <img src="img/icon-urso.png" alt="LumiTEA">
      LumiTEA
    </a>
    <a href="conversa.html" class="btn-back">← Voltar ao chat</a>
  </div>

  <div class="stage">
    <h1 class="titulo">Conversa por voz com a Lumi</h1>
    <p class="subtitulo">Aperte <b>Falar com a Lumi</b> e fale. A Lumi ouve, pensa e responde na hora — você só conversa.</p>

    <div class="ball-wrap">
      <div class="loader idle" id="bola" title="Estado da Lumi">
        <svg width="100" height="100" viewBox="0 0 100 100">
          <defs>
            <mask id="clipping">
              <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
              <polygon points="25,25 75,25 50,75" fill="white"></polygon>
              <polygon points="50,25 75,75 25,75" fill="white"></polygon>
              <polygon points="35,35 65,35 50,65" fill="white"></polygon>
              <polygon points="35,35 65,35 50,65" fill="white"></polygon>
              <polygon points="35,35 65,35 50,65" fill="white"></polygon>
              <polygon points="35,35 65,35 50,65" fill="white"></polygon>
            </mask>
          </defs>
        </svg>
        <div class="box"></div>
      </div>
    </div>

    <div class="status idle" id="status">
      <span class="dot"></span>
      <span id="status-txt">Pronta para conversar</span>
    </div>

    <div class="controles">
      <button class="ctrl-btn primary" id="btnGravar"><i class="lt-i" data-lt-icon="mic" aria-hidden="true"></i> Falar com a Lumi</button>
      <button class="ctrl-btn" id="btnParar" disabled>⏹ Parar</button>
      <button class="ctrl-btn" id="btnMute" title="Cortar resposta de voz"><i class="lt-i" data-lt-icon="x" aria-hidden="true"></i> Silenciar</button>
    </div>

    <div class="transcricao" id="transcricao"></div>

    <audio id="player" hidden></audio>
  </div>

<script>
(function () {
  var ELEVEN_KEY    = (window.LUMITEA && window.LUMITEA.ELEVEN_API_KEY) || '';
  var ELEVEN_VOICE  = (window.LUMITEA && window.LUMITEA.ELEVEN_VOICE_ID) || '21m00Tcm4TlvDq8ikWAM';
  var ELEVEN_MODEL  = (window.LUMITEA && window.LUMITEA.ELEVEN_MODEL) || 'eleven_multilingual_v2';
  var ELEVEN_VOICE_FALLBACK = '21m00Tcm4TlvDq8ikWAM';

  var bola = document.getElementById('bola');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('status-txt');
  var transcEl = document.getElementById('transcricao');
  var btnGravar = document.getElementById('btnGravar');
  var btnParar  = document.getElementById('btnParar');
  var btnMute   = document.getElementById('btnMute');
  var player    = document.getElementById('player');

  var mediaRecorder = null;
  var chunks = [];
  var stream = null;
  var historico = [];
  var muted = false;

  function setEstado(estado, msg) {
    ['idle','gravando','pensando','falando'].forEach(function (s) {
      bola.classList.remove(s);
      statusEl.classList.remove(s);
    });
    bola.classList.add(estado);
    statusEl.classList.add(estado);
    if (msg) statusTxt.textContent = msg;
  }

  function addLinha(quem, texto, klass) {
    var linha = document.createElement('div');
    linha.className = 'linha' + (klass ? ' ' + klass : '');
    linha.innerHTML = '<b>' + quem + ':</b> ' + texto;
    transcEl.appendChild(linha);
    transcEl.scrollTop = transcEl.scrollHeight;
  }

  btnMute.addEventListener('click', function () {
    muted = !muted;
    btnMute.innerHTML = (window.LUMI?LUMI.icon(muted?'play':'x'):'') + (muted ? ' Som ligado' : ' Silenciar');
    if (muted) { try { player.pause(); player.currentTime = 0; } catch(e) {} }
  });

  btnGravar.addEventListener('click', async function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setEstado('idle', 'Microfone não disponível neste navegador.');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setEstado('idle', 'Permita o uso do microfone para conversar.');
      return;
    }
    chunks = [];
    var options = { mimeType: 'audio/webm' };
    try { mediaRecorder = new MediaRecorder(stream, options); }
    catch (e) { mediaRecorder = new MediaRecorder(stream); }

    mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = onGravacaoTerminada;
    mediaRecorder.start();

    setEstado('gravando', 'Estou te ouvindo...');
    btnGravar.disabled = true;
    btnParar.disabled = false;
  });

  btnParar.addEventListener('click', function () {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    btnParar.disabled = true;
  });

  async function onGravacaoTerminada() {
    setEstado('pensando', 'Processando o que você disse...');
    var blob = new Blob(chunks, { type: 'audio/webm' });
    chunks = [];

    var texto;
    try {
      texto = await transcrever(blob);
    } catch (e) {
      console.error(e);
      setEstado('idle', 'Não consegui entender o áudio. Tenta de novo?');
      btnGravar.disabled = false;
      return;
    }
    if (!texto || !texto.trim()) {
      setEstado('idle', 'Não captei nada. Pode falar de novo?');
      btnGravar.disabled = false;
      return;
    }
    addLinha('Você', texto);
    historico.push({ role: 'user', content: texto });

    setEstado('pensando', 'A Lumi está pensando...');
    var resposta;
    try {
      if (window.LumiIA && window.LumiIA.responder) {
        var r = await window.LumiIA.responder(historico, null, {});
        resposta = (r && r.texto) || 'Hmm, deixa eu pensar de novo.';
      } else {
        resposta = 'A IA não está carregada.';
      }
    } catch (e) {
      console.error(e);
      resposta = 'Tive um probleminha. Pode repetir?';
    }
    addLinha('Lumi', resposta, 'lumi');
    historico.push({ role: 'assistant', content: resposta });

    if (!muted) {
      setEstado('falando', 'Lumi respondendo...');
      try { await falar(resposta); }
      catch (e) { console.error(e); }
    }
    setEstado('idle', 'Pode falar de novo quando quiser.');
    btnGravar.disabled = false;
  }

  // ElevenLabs STT
  async function transcrever(blob) {
    if (!ELEVEN_KEY) throw new Error('ELEVEN_API_KEY ausente');
    var fd = new FormData();
    fd.append('file', blob, 'audio.webm');
    fd.append('model_id', 'scribe_v1');
    fd.append('language_code', 'por');

    var res = await fetch('https://api.elevenlabs.io/v1/speech-to-text', {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY },
      body: fd
    });
    if (!res.ok) {
      var detail = await res.text().catch(function () { return ''; });
      console.warn('[STT] ElevenLabs falhou:', res.status, detail);
      return await transcreverBrowser(blob);
    }
    var data = await res.json();
    return (data.text || '').trim();
  }

  function transcreverBrowser(blob) {
    return new Promise(function (resolve, reject) {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return reject(new Error('SpeechRecognition indisponível'));
      var url = URL.createObjectURL(blob);
      var audio = new Audio(url);
      var recog = new SR();
      recog.lang = 'pt-BR';
      recog.continuous = false;
      recog.interimResults = false;
      recog.onresult = function (e) { resolve(e.results[0][0].transcript); };
      recog.onerror = function (e) { reject(e); };
      recog.onend = function () { URL.revokeObjectURL(url); };
      try { recog.start(); audio.play(); } catch(e) { reject(e); }
    });
  }

  // ElevenLabs TTS
  async function falar(texto) {
    if (!ELEVEN_KEY) return;

    async function ttsVoice(voiceId) {
      var url = 'https://api.elevenlabs.io/v1/text-to-speech/' + voiceId;
      var res = await fetch(url, {
        method: 'POST',
        headers: {
          'xi-api-key': ELEVEN_KEY,
          'Content-Type': 'application/json',
          'Accept': 'audio/mpeg'
        },
        body: JSON.stringify({
          text: texto,
          model_id: ELEVEN_MODEL,
          voice_settings: { stability: 0.45, similarity_boost: 0.75, style: 0.25, use_speaker_boost: true }
        })
      });
      if (!res.ok) {
        var detail = await res.text().catch(function(){ return ''; });
        throw new Error('TTS HTTP ' + res.status + ' ' + detail.slice(0, 150));
      }
      return await res.blob();
    }

    var audioBlob;
    try {
      audioBlob = await ttsVoice(ELEVEN_VOICE);
    } catch (e) {
      console.warn('[TTS] voice id customizado falhou, tentando fallback Rachel:', e.message);
      try {
        audioBlob = await ttsVoice(ELEVEN_VOICE_FALLBACK);
      } catch (e2) {
        console.error('[TTS] fallback também falhou:', e2.message);
        return falarBrowser(texto);
      }
    }
    var url = URL.createObjectURL(audioBlob);
    player.src = url;
    await new Promise(function (resolve) {
      player.onended = resolve;
      player.onerror = resolve;
      player.play().catch(resolve);
    });
    URL.revokeObjectURL(url);
  }

  function falarBrowser(texto) {
    return new Promise(function (resolve) {
      if (!('speechSynthesis' in window)) return resolve();
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR';
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  // Clicar na bola = atalho gravar/parar
  bola.addEventListener('click', function () {
    if (!btnGravar.disabled) btnGravar.click();
    else if (!btnParar.disabled) btnParar.click();
  });
})();
</script>
</body>
</html>

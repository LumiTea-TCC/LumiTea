<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>LumiTEA — Conversar com o Theo</title>
 <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
 <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
 <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="lumitea.css">
 <link rel="stylesheet" href="app.css">
 <link rel="stylesheet" href="css/tokens.css">
 <link rel="stylesheet" href="css/enhance.css"><!--lt-enhance-->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 <script src="js/core/secrets.js"></script>
 <script src="js/core/config.js"></script>
 <script src="js/core/icons.js" defer></script>
 <script src="js/core/ui.js" defer></script>
</head>
<body class="app-body entrada-conv-page">

  <nav class="app-nav">
    <a class="logo" href="home-autista.html">
      <div class="logo-icon"><img src="img/icon-urso.png" alt=""></div>
      LumiTEA
    </a>
    <div class="app-nav-links">
      <a href="home-autista.html">Início</a>
      <a href="entrada-conv.html" class="active" aria-current="page">Conversar</a>
      <a href="games.html">Jogos</a>
      <a href="comunidade.html">Comunidade</a>
      <a href="calendario.html">Calendário</a>
      <a href="diario.html">Diário</a>
      <a href="conta.html">Conta</a>
    </div>
    <div class="app-nav-right">
      <div class="user-badge">
        <div class="user-badge-av"><img src="img/urso-coder.png" alt="" id="nav-avatar"></div>
        <span id="nav-user-name">Carregando...</span>
      </div>
      <button class="btn-logout" onclick="sairDaConta()">Sair</button>
    </div>

    <label class="app-burger" for="burger-entrada">
      <input type="checkbox" id="burger-entrada">
      <span></span>
      <span></span>
      <span></span>
    </label>
  </nav>

  <div id="mm-entrada" class="app-mobile-menu">
    <a href="home-autista.html">Início</a>
    <a href="entrada-conv.html" class="active" aria-current="page">Conversar</a>
    <a href="games.html">Jogos</a>
    <a href="comunidade.html">Comunidade</a>
    <a href="calendario.html">Calendário</a>
    <a href="diario.html">Diário</a>
    <a href="conta.html">Conta</a>
    <div class="mm-rodape">
      <button class="btn-logout" onclick="sairDaConta()">Sair</button>
    </div>
  </div>

  <main class="enc-hero">
    <div class="enc-bloco lt-enter">
      <h1 class="enc-titulo">Lumi <span class="enc-titulo-mark">Theo</span></h1>
      <p class="enc-sub">
        Escreva pro Theo sobre o que quiser: seu dia, uma preocupação ou só desabafar.
        No seu tempo, sem certo nem errado.
      </p>
      <a class="enc-cta" href="conversa.html">
        Conversar com o Theo
        <span class="enc-cta-seta" aria-hidden="true">→</span>
      </a>
    </div>

    <div class="enc-arte">
      <img src="img/urso-conersando.png" alt="Dois ursos conversando sentados à mesa, cada um com sua caneca">
    </div>
  </main>

  <script>
    async function sairDaConta() {
      try {
        if (window.supabaseClient) await window.supabaseClient.auth.signOut()
      } catch (e) { console.warn('[entrada-conv] sair:', e.message) }
      window.location.href = 'login.html'
    }

    async function iniciarPagina() {
      if (!window.supabaseClient) return
      const { data: { session } } = await window.supabaseClient.auth.getSession()
      if (!session) { window.location.href = 'login.html'; return }

      try {
        const { data: perfil } = await window.supabaseClient
          .from('profiles').select('nome').eq('id', session.user.id).single()
        document.getElementById('nav-user-name').textContent = (perfil && perfil.nome) || 'Você'
      } catch (e) {
        console.warn('[entrada-conv] perfil:', e.message)
        document.getElementById('nav-user-name').textContent = 'Você'
      }
    }

    (function () {
      var cb = document.getElementById('burger-entrada')
      var menu = document.getElementById('mm-entrada')
      if (!cb || !menu) return
      cb.addEventListener('change', function () { menu.style.display = cb.checked ? 'flex' : 'none' })
      menu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { cb.checked = false; menu.style.display = 'none' })
      })
    })();

    iniciarPagina()
  </script>

  <!-- Widgets globais -->
  <script src="js/evento-checkin.js"></script>
  <script src="js/sobrecarga.js"></script>
</body>
</html>

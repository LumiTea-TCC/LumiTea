 <style>
 /* ── A JORNADA DO THEO — porte fiel da versão Next.js ── */
 .rpg-wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 90px; position: relative; z-index: 1; }
 .rpg { display: flex; flex-direction: column; gap: 18px; }

 .rpg-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
 .rpg-tag { display:inline-block; font-size:.64rem; font-weight:900; letter-spacing:.14em; color:#7c5cbf; background:#f3eeff; border:1px solid #e2d7fb; padding:5px 11px; border-radius:99px; }
 .rpg-head h1 { font-family:'Baloo 2',sans-serif; font-size:1.9rem; color:#1a2e4a; margin:10px 0 4px; }
 .rpg-head p { color:#5a7fa8; line-height:1.55; max-width:560px; margin:0; font-size:.92rem; }

 .rpg-card { background:#fff; border:1.5px solid #d8e5f2; border-radius:22px; padding:22px 24px; box-shadow:0 6px 22px rgba(74,126,181,.08); }
 .rpg-h2 { font-family:'Baloo 2',sans-serif; font-size:1.3rem; color:#1a2e4a; margin:0 0 6px; }
 .rpg-h3 { font-family:'Baloo 2',sans-serif; font-size:1.05rem; color:#1a2e4a; margin:16px 0 10px; }
 .rpg-muted { color:#5a7fa8; line-height:1.55; margin:0 0 14px; }
 .rpg-muted.sm { font-size:.82rem; }

 .rpg-label { display:block; font-weight:800; color:#3d6080; font-size:.85rem; margin:8px 0 6px; }
 .rpg-input { width:100%; padding:12px 14px; border:1.5px solid #b3d9f8; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; color:#1a2e4a; margin-bottom:18px; }
 .rpg-input:focus { outline:3px solid rgba(74,126,181,.35); outline-offset:1px; border-color:#4a7eb5; }

 .rpg-classes { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
 .rpg-classe { display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background:#f8fbff; border:2px solid #d8e5f2; border-radius:18px; padding:18px; cursor:pointer; transition:all .16s ease; font-family:'Nunito',sans-serif; }
 .rpg-classe:hover, .rpg-classe:focus-visible { border-color:#7c5cbf; transform:translateY(-2px); outline:none; box-shadow:0 8px 22px rgba(124,92,191,.16); }
 .rpg-classe-emoji { font-size:2.2rem; }
 .rpg-classe strong { font-family:'Baloo 2',sans-serif; font-size:1.1rem; color:#1a2e4a; }
 .rpg-ritmo { font-size:.66rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px; }
 .rpg-ritmo-tranquilo { background:#e6f6f5; color:#2c7a76; }
 .rpg-ritmo-equilibrado { background:#eaf1fb; color:#2e5fa3; }
 .rpg-ritmo-corajoso { background:#fdeee6; color:#b5602a; }
 .rpg-classe p { font-size:.85rem; color:#5a7fa8; line-height:1.5; margin:4px 0 0; }
 .rpg-classe-cta { margin-top:8px; font-weight:800; color:#7c5cbf; font-size:.88rem; }

 .rpg-hud { display:flex; gap:18px; flex-wrap:wrap; background:#fff; border:1.5px solid #d8e5f2; border-radius:18px; padding:14px 18px; box-shadow:0 4px 14px rgba(74,126,181,.07); }
 .rpg-hud-item { flex:1; min-width:160px; }
 .rpg-hud-label { font-size:.74rem; font-weight:900; color:#3d6080; }
 .rpg-hud-item small { font-size:.72rem; color:#6b9ab8; font-weight:700; }
 .rpg-bar { height:12px; background:#eaf1fb; border-radius:99px; overflow:hidden; margin:5px 0 3px; }
 .rpg-bar-fill { display:block; height:100%; border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1); }
 .rpg-bar-fill.calma { background:linear-gradient(90deg,#5ab0e0,#2e8fc9); }
 .rpg-bar-fill.xp { background:linear-gradient(90deg,#ffce6b,#f0a531); }
 .rpg-bar-fill.prog { background:linear-gradient(90deg,#8fd6a3,#3aa39f); }
 .rpg-hud-itens { flex:0 0 auto; min-width:auto; }
 .rpg-itens-list { display:flex; gap:4px; font-size:1.2rem; margin-top:4px; }

 .rpg-mapa-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
 .rpg-switch { display:inline-flex; align-items:center; gap:7px; background:#f4f8fd; border:1.5px solid #d8e5f2; border-radius:99px; padding:6px 12px; font-size:.78rem; font-weight:800; color:#5a7fa8; cursor:pointer; font-family:'Nunito',sans-serif; }
 .rpg-switch.on { background:#f3eeff; border-color:#cdb8f5; color:#6a44b0; }
 .rpg-switch-dot { width:12px; height:12px; border-radius:99px; background:#c3d3e6; }
 .rpg-switch.on .rpg-switch-dot { background:#7c5cbf; }

 .rpg-trilha { list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
 .rpg-cap { display:flex; align-items:center; gap:14px; background:#f8fbff; border:1.5px solid #d8e5f2; border-radius:16px; padding:14px 16px; }
 .rpg-cap.atual { border-color:#7c5cbf; box-shadow:0 0 0 3px rgba(124,92,191,.12); }
 .rpg-cap.ok { background:#f1faf3; border-color:#bfe6cb; }
 .rpg-cap.bloq { opacity:.55; }
 .rpg-cap-emoji { width:46px; height:46px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:#fff; border-radius:14px; border:1.5px solid #e2ebf5; }
 .rpg-cap.ok .rpg-cap-emoji { color:#2e7d4f; background:#e7f6ec; border-color:#bfe6cb; }
 .rpg-cap-info { flex:1; }
 .rpg-cap-info strong { display:block; font-family:'Baloo 2',sans-serif; color:#1a2e4a; font-size:1rem; }
 .rpg-cap-final { color:#b5602a; font-style:normal; font-weight:800; font-size:.78rem; }
 .rpg-cap-info p { margin:3px 0 0; font-size:.84rem; color:#5a7fa8; line-height:1.45; }

 .rpg-btn { background:linear-gradient(135deg,#7c5cbf,#5b3fa3); color:#fff; border:none; border-radius:12px; padding:10px 18px; font-family:'Nunito',sans-serif; font-weight:800; font-size:.88rem; cursor:pointer; min-height:44px; flex-shrink:0; transition:transform .15s, box-shadow .2s; }
 .rpg-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 16px rgba(124,92,191,.3); }
 .rpg-btn:disabled { background:#c3d3e6; cursor:not-allowed; }
 .rpg-btn.grande { width:100%; padding:14px; font-size:1rem; margin-top:18px; }
 .rpg-btn-ghost { background:#fff; color:#5b3fa3; border:1.5px solid #cdb8f5; border-radius:12px; padding:9px 16px; font-family:'Nunito',sans-serif; font-weight:800; font-size:.84rem; cursor:pointer; min-height:44px; }
 .rpg-btn-ghost.sm { padding:6px 12px; font-size:.78rem; min-height:auto; }
 .rpg-btn-ghost:hover { background:#f6f1ff; }

 .rpg-cena-head { display:flex; align-items:center; gap:12px; }
 .rpg-cena-emoji { font-size:2rem; width:52px; height:52px; display:flex; align-items:center; justify-content:center; background:#f3eeff; border-radius:15px; flex-shrink:0; }
 .rpg-cena-head > div { flex:1; }
 .rpg-npc { font-size:.8rem; color:#7c5cbf; font-weight:800; }
 .rpg-prog { margin:14px 0; }
 .rpg-prog > span { font-size:.74rem; font-weight:900; color:#3d6080; }
 .rpg-narracao { font-size:1.05rem; line-height:1.65; color:#1a2e4a; background:#f8fbff; border-left:4px solid #7c5cbf; border-radius:0 12px 12px 0; padding:14px 16px; margin:6px 0 12px; }
 .rpg-dica { font-size:.86rem; color:#7a5a1a; background:#fff8ea; border:1px solid #f1e2bf; border-radius:12px; padding:10px 14px; line-height:1.5; }
 .rpg-log { display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto; margin:14px 0 0; padding:12px 14px; background:#f1faf3; border:1px solid #cdeccf; border-radius:12px; }
 .rpg-log p { margin:0; font-size:.88rem; color:#2e6b4f; line-height:1.5; }

 .rpg-escolhas { display:flex; flex-direction:column; gap:10px; }
 .rpg-escolha { text-align:left; background:#fff; border:2px solid #d8e5f2; border-radius:14px; padding:14px 16px; font-family:'Nunito',sans-serif; font-size:.96rem; color:#1a2e4a; cursor:pointer; line-height:1.45; transition:all .15s ease; min-height:44px; }
 .rpg-escolha:hover:not(:disabled) { border-color:#4a7eb5; background:#f4f9ff; transform:translateX(2px); }
 .rpg-escolha:disabled { opacity:.45; cursor:default; }

 .rpg-hab-box { margin-top:18px; border-top:1px dashed #d8e5f2; padding-top:14px; }
 .rpg-hab-box summary { cursor:pointer; font-weight:800; color:#3d6080; font-size:.9rem; }
 .rpg-habs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
 .rpg-hab { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 8px; border-radius:13px; border:1.5px solid #d8e5f2; background:#f8fbff; cursor:pointer; font-family:'Nunito',sans-serif; text-align:center; transition:all .14s ease; }
 .rpg-hab.regular { background:#eaf6fc; border-color:#bfe1f3; }
 .rpg-hab.avancar { background:#f1faf3; border-color:#cdeccf; }
 .rpg-hab:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 5px 12px rgba(74,126,181,.14); }
 .rpg-hab:disabled { opacity:.4; cursor:not-allowed; }
 .rpg-hab-emoji { font-size:1.4rem; }
 .rpg-hab-nome { font-size:.76rem; font-weight:800; color:#1a2e4a; line-height:1.2; }
 .rpg-hab-usos { font-size:.68rem; font-weight:800; color:#6b9ab8; }

 .rpg-resultado, .rpg-fim { text-align:center; }
 .rpg-resultado-emoji, .rpg-fim-emoji { font-size:2.6rem; }
 .rpg-ganhos { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
 .rpg-ganho { font-weight:800; font-size:.9rem; padding:7px 14px; border-radius:99px; background:#eaf1fb; color:#2e5fa3; }
 .rpg-ganho.lvl { background:#fff3da; color:#b5802a; }
 .rpg-ganho.item { background:#f3eeff; color:#6a44b0; }
 .rpg-item-desc { font-size:.86rem; color:#5a7fa8; margin:0 0 4px; }
 .rpg-novas { text-align:left; background:#f3eeff; border:1px solid #e2d7fb; border-radius:12px; padding:12px 16px; margin:8px 0; }
 .rpg-novas strong { color:#6a44b0; font-size:.9rem; }
 .rpg-novas ul { margin:6px 0 0; padding-left:20px; color:#3d6080; }
 .rpg-cap-fim { color:#2e7d4f; font-weight:800; margin:10px 0 0; }
 .rpg-fim p { color:#1a2e4a; line-height:1.6; }
 .rpg-fim-btns { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }

 .rpg-modal-overlay { position:fixed; inset:0; z-index:1000; background:rgba(15,26,42,.55); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:18px; }
 .rpg-modal { background:#fff; border-radius:22px; max-width:460px; width:100%; padding:28px 26px; text-align:center; box-shadow:0 20px 60px rgba(15,26,42,.28); }
 .rpg-modal-emoji { font-size:2.4rem; margin-bottom:6px; }
 .rpg-modal p { color:#3d6080; line-height:1.6; }

 @media (max-width:560px) {
   .rpg-head h1 { font-size:1.6rem; }
   .rpg-hud { gap:12px; }
 }
 @media (prefers-reduced-motion: reduce) {
   .rpg-classe, .rpg-btn, .rpg-escolha, .rpg-hab { transition:none; }
   .rpg-classe:hover, .rpg-btn:hover, .rpg-escolha:hover, .rpg-hab:hover { transform:none; }
   .rpg-bar-fill { transition:none; }
 }

 <script>
 /* =====================================================================
    A JORNADA DO THEO — porte vanilla do RPG (web/lib/rpg + RpgClient).
    Save em localStorage (mesma chave da versão Next). Mecânica idêntica.
    ===================================================================== */

 const SUPABASE_URL = (window.LUMITEA && window.LUMITEA.SUPABASE_URL) || '';
 const SUPABASE_ANON_KEY = (window.LUMITEA && window.LUMITEA.SUPABASE_ANON_KEY) || '';
 const sb = (window.supabase && SUPABASE_URL) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
 const GROQ_MODEL = (window.LUMITEA && window.LUMITEA.GROQ_MODEL) || 'llama-3.3-70b-versatile';

 async function chamarGroq(systemPrompt, msgs, maxTokens) {
   async function tryModel(model) {
     const r = await window.LUMITEA.groqFetch({ model: model, max_tokens: maxTokens || 220, temperature: 0.7,
         messages: [{ role: 'system', content: systemPrompt }].concat(msgs) });
     if (!r.ok) throw new Error('HTTP ' + r.status);
     const d = await r.json();
     return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
   }
   try { return await tryModel(GROQ_MODEL); }
   catch(e) { return await tryModel('llama-3.1-8b-instant'); }
 }

 /* ============ ENGINE ============ */
 const VERSAO_SAVE = 1;
 const SAVE_KEY = 'lumitea_rpg_save_v1';
 const ENRICH_KEY = 'lumitea_rpg_enrich';

 function xpDoNivel(nivel) { return 80 + (nivel - 1) * 40; }

 function criarEstado(classeId, nome) {
   const classe = CLASSES[classeId];
   const habilidades = classe.habilidadesIniciais.map(function(id){ return { id:id, usos:HABILIDADES[id].usosMax }; });
   return {
     versao:VERSAO_SAVE, classe:classeId, nome:(nome||'').trim() || 'herói',
     nivel:1, xp:0, xpProx:xpDoNivel(1),
     calma:classe.calmaMax, calmaMax:classe.calmaMax,
     habilidades:habilidades, itens:[],
     capituloIdx:0, momentoIdx:0,
     capitulosConcluidos:[], momentosConcluidos:[],
   };
 }

 function ajustarCalma(e, delta) {
   const calma = Math.max(0, Math.min(e.calmaMax, e.calma + delta));
   return Object.assign({}, e, { calma:calma });
 }
 function usarHabilidade(e, id) {
   const habilidades = e.habilidades.map(function(h){ return (h.id===id && h.usos>0) ? Object.assign({},h,{usos:h.usos-1}) : h; });
   return Object.assign({}, e, { habilidades:habilidades });
 }
 function usosRestantes(e, id) {
   const h = e.habilidades.find(function(x){ return x.id===id; });
   return h ? h.usos : 0;
 }
 function ganharXp(estado, xp) {
   let novo = Object.assign({}, estado, { xp: estado.xp + Math.max(0, xp) });
   let subiu = false, novosNiveis = 0; const habilidadesNovas = [];
   while (novo.xp >= novo.xpProx) {
     novo = Object.assign({}, novo, { xp: novo.xp - novo.xpProx, nivel: novo.nivel + 1 });
     novo.xpProx = xpDoNivel(novo.nivel);
     novo.calmaMax = novo.calmaMax + 10;
     novo.calma = novo.calmaMax;
     subiu = true; novosNiveis += 1;
     novo.habilidades = novo.habilidades.map(function(h){ return Object.assign({},h,{usos:HABILIDADES[h.id].usosMax}); });
     if (novo.classe) {
       const desb = CLASSES[novo.classe].desbloqueios.filter(function(d){
         return d.nivel <= novo.nivel && !novo.habilidades.some(function(h){ return h.id===d.habilidade; });
       });
       desb.forEach(function(d){
         novo.habilidades = novo.habilidades.concat([{ id:d.habilidade, usos:HABILIDADES[d.habilidade].usosMax }]);
         habilidadesNovas.push(d.habilidade);
       });
     }
   }
   return { estado:novo, subiuNivel:subiu, novosNiveis:novosNiveis, habilidadesNovas:habilidadesNovas };
 }
 function sortearItem() {
   if (Math.random() > 0.18) return null;
   return ITENS_LISTA[Math.floor(Math.random() * ITENS_LISTA.length)];
 }
 function aplicarItem(e, item) {
   let novo = Object.assign({}, e, { itens: e.itens.concat([item.id]) });
   if (item.efeito.calma) novo = ajustarCalma(novo, item.efeito.calma);
   if (item.efeito.recargaHabilidades) {
     novo.habilidades = novo.habilidades.map(function(h){ return Object.assign({},h,{usos:HABILIDADES[h.id].usosMax}); });
   }
   return novo;
 }
 function avancarPosicao(e) {
   const cap = CAPITULOS[e.capituloIdx];
   const momento = cap.momentos[e.momentoIdx];
   const momentosConcluidos = e.momentosConcluidos.includes(momento.id) ? e.momentosConcluidos : e.momentosConcluidos.concat([momento.id]);
   if (e.momentoIdx + 1 < cap.momentos.length) {
     return Object.assign({}, e, { momentoIdx: e.momentoIdx + 1, momentosConcluidos:momentosConcluidos });
   }
   const capitulosConcluidos = e.capitulosConcluidos.includes(cap.id) ? e.capitulosConcluidos : e.capitulosConcluidos.concat([cap.id]);
   const proxCap = Math.min(e.capituloIdx + 1, CAPITULOS.length - 1);
   return Object.assign({}, e, { momentosConcluidos:momentosConcluidos, capitulosConcluidos:capitulosConcluidos, capituloIdx:proxCap, momentoIdx:0 });
 }
 function jogoCompleto(e) {
   const ultimo = CAPITULOS[CAPITULOS.length - 1];
   return e.capitulosConcluidos.includes(ultimo.id);
 }
 function irParaCapitulo(e, idx) {
   if (!capituloLiberado(e, idx)) return e;
   return Object.assign({}, e, { capituloIdx:idx, momentoIdx:0 });
 }
 function capituloLiberado(e, idx) {
   if (idx === 0) return true;
   return e.capitulosConcluidos.includes(CAPITULOS[idx-1].id) || idx <= e.capituloIdx;
 }
 function salvar(e) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(e)); } catch(x){} }
 function carregar() {
   try {
     const raw = localStorage.getItem(SAVE_KEY);
     if (!raw) return null;
     const p = JSON.parse(raw);
     if (p.versao !== VERSAO_SAVE || !p.classe) return null;
     return p;
   } catch(x) { return null; }
 }
 function apagarSave() { try { localStorage.removeItem(SAVE_KEY); } catch(x){} }

 function itemEmoji(id) { return ({ fone:'🎧', conforto:'🧸', carta:'💌', agua:'💧' })[id] || '✨'; }
 function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

   if (vista === 'carregando') html += '<p class="rpg-muted">Carregando…</p>';
   else if (vista === 'classe') html += classeHTML();
   else if (vista === 'mapa') html += mapaHTML();
   else if (vista === 'cena') html += cenaHTML();
   else if (vista === 'resultado') html += resultadoHTML();
   else if (vista === 'fim') html += fimHTML();
   root.innerHTML = html;
   renderModalPausa();
   const logEl = document.getElementById('rpg-log');
   if (logEl) logEl.scrollTop = logEl.scrollHeight;
 }

 function hudHTML(e) {
   const calmaPct = Math.round((e.calma / e.calmaMax) * 100);
   const xpPct = Math.round((e.xp / e.xpProx) * 100);
   let h = '<section class="rpg-hud">';
   h += '<div class="rpg-hud-item"><span class="rpg-hud-label">💙 Calma</span>' +
     '<div class="rpg-bar"><span class="rpg-bar-fill calma" style="width:' + calmaPct + '%"></span></div>' +
     '<small>' + e.calma + '/' + e.calmaMax + '</small></div>';
   h += '<div class="rpg-hud-item"><span class="rpg-hud-label">⭐ Nível ' + e.nivel + '</span>' +
     '<div class="rpg-bar"><span class="rpg-bar-fill xp" style="width:' + xpPct + '%"></span></div>' +
     '<small>' + e.xp + '/' + e.xpProx + ' XP</small></div>';
   if (e.itens.length > 0) {
     h += '<div class="rpg-hud-item rpg-hud-itens"><span class="rpg-hud-label">🎒 Itens</span>' +
       '<span class="rpg-itens-list">' + e.itens.map(function(id){ return '<span title="' + esc(id) + '">' + itemEmoji(id) + '</span>'; }).join('') + '</span></div>';
   }
   h += '</section>';
   return h;
 }

 function mapaHTML() {
   const classe = estado.classe ? CLASSES[estado.classe] : null;
   let h = hudHTML(estado);
   h += '<section class="rpg-card">';
   h += '<div class="rpg-mapa-head"><h2 class="rpg-h2">Mapa da jornada</h2>' +
     '<button type="button" class="rpg-switch ' + (enrich ? 'on' : '') + '" onclick="toggleEnrich()" aria-pressed="' + enrich + '" title="Quando ligado, o Theo descreve algumas cenas com mais detalhe (usando IA).">' +
     '<span class="rpg-switch-dot"></span>✨ Narração detalhada do Theo</button></div>';
   h += '<p class="rpg-muted">' + (classe ? classe.emoji : '') + ' Você é uma ' + (classe ? esc(classe.nome) : '') + '. Escolha um capítulo. Os próximos abrem conforme você avança.</p>';
   h += '<ol class="rpg-trilha">';
   CAPITULOS.forEach(function(cap, idx){
     const liberado = capituloLiberado(estado, idx);
     const concluido = estado.capitulosConcluidos.includes(cap.id);
     const atual = idx === estado.capituloIdx && !concluido;
     const cls = 'rpg-cap ' + (liberado ? '' : 'bloq') + ' ' + (atual ? 'atual' : '') + ' ' + (concluido ? 'ok' : '');
     const emoji = concluido ? ((window.LUMI&&LUMI.icon('check'))||'✓') : (liberado ? cap.emoji : ((window.LUMI&&LUMI.icon('lock'))||''));
     const acao = atual ? 'continuar()' : 'abrirCapitulo(' + idx + ')';
     const rotulo = concluido ? 'Revisitar' : (atual ? 'Continuar' : (liberado ? 'Começar' : 'Bloqueado'));
     h += '<li class="' + cls.trim() + '">' +
       '<span class="rpg-cap-emoji" aria-hidden>' + emoji + '</span>' +
       '<div class="rpg-cap-info"><strong>Capítulo ' + cap.numero + ': ' + esc(cap.titulo) + (cap.final ? '<em class="rpg-cap-final"> · final</em>' : '') + '</strong>' +
       '<p>' + esc(cap.resumo) + '</p></div>' +
       '<button type="button" class="rpg-btn" ' + (liberado ? '' : 'disabled') + ' onclick="' + acao + '">' + rotulo + '</button>' +
       '</li>';
   });
   h += '</ol></section>';
   return h;
 }

 function momentoAtual() {
   return CAPITULOS[estado.capituloIdx].momentos[estado.momentoIdx];
 }

   const progPct = Math.round((progresso / m.meta) * 100);

   let h = hudHTML(estado);
   h += '<section class="rpg-card rpg-cena">';
   h += '<div class="rpg-cena-head"><span class="rpg-cena-emoji" aria-hidden>' + m.emoji + '</span>' +
     '<div><h2 class="rpg-h2">' + esc(m.titulo) + '</h2>' +
     (m.personagem ? '<span class="rpg-npc">com ' + esc(m.personagem) + '</span>' : '') + '</div>' +
     '<button type="button" class="rpg-btn-ghost sm" onclick="irMapa()">🗺️ Mapa</button></div>';
   h += '<div class="rpg-prog"><span>Como vai o momento</span><div class="rpg-bar"><span class="rpg-bar-fill prog" style="width:' + progPct + '%"></span></div></div>';
   h += '<p class="rpg-narracao">' + esc(narr) + (carregandoIA ? ' <em style="color:#7c5cbf;">✨…</em>' : '') + '</p>';
   h += '<div class="rpg-dica">💡 Dica do Theo: ' + esc(m.dica) + '</div>';
   if (log.length > 0) {
     h += '<div class="rpg-log" id="rpg-log">' + log.map(function(l){ return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';
   }
   h += '<h3 class="rpg-h3">O que você faz?</h3><div class="rpg-escolhas">';
   m.escolhas.forEach(function(e){
     h += '<button type="button" class="rpg-escolha" ' + (escolhasFeitas.includes(e.id) ? 'disabled' : '') + ' onclick="onEscolha(\'' + e.id + '\')">' + esc(e.texto) + '</button>';
   });
   h += '</div>';
   h += '<details class="rpg-hab-box" ' + (window.__habOpen ? 'open' : '') + ' ontoggle="window.__habOpen=this.open"><summary>🧰 Minhas habilidades (ajudam quando você precisa)</summary>' +
     '<p class="rpg-muted sm">Cada habilidade tem usos limitados. Usos voltam quando você sobe de nível. Habilidades de regular devolvem Calma; as de avançar ajudam a superar o momento.</p>' +
     '<div class="rpg-habs">';
   estado.habilidades.forEach(function(h2){
     const hab = HABILIDADES[h2.id];
     h += '<button type="button" class="rpg-hab ' + hab.tipo + '" ' + (h2.usos <= 0 ? 'disabled' : '') + ' onclick="onHabilidade(\'' + h2.id + '\')" title="' + esc(hab.descricao) + '">' +
       '<span class="rpg-hab-emoji" aria-hidden>' + hab.emoji + '</span>' +
       '<span class="rpg-hab-nome">' + esc(hab.nome) + '</span>' +
       '<span class="rpg-hab-usos">' + h2.usos + ' usos</span></button>';
   });
   h += '</div></details></section>';
   return h;
 }

 function resultadoHTML() {
   const r = resultado;
   let h = '<section class="rpg-card rpg-resultado">';
   h += '<div class="rpg-resultado-emoji">🐻💛</div>';
   h += '<h2 class="rpg-h2">Você atravessou esse momento!</h2>';
   h += '<p class="rpg-muted">Não existe jeito errado de chegar até aqui. Você usou suas estratégias e seguiu em frente.</p>';
   h += '<div class="rpg-ganhos"><span class="rpg-ganho">+' + r.xpGanho + ' XP</span>';
   if (r.subiuNivel) h += '<span class="rpg-ganho lvl">⭐ Subiu pro nível ' + estado.nivel + '!</span>';
   if (r.item) h += '<span class="rpg-ganho item">' + r.item.emoji + ' Ganhou: ' + esc(r.item.nome) + '</span>';
   h += '</div>';
   if (r.item) h += '<p class="rpg-item-desc">' + esc(r.item.descricao) + '</p>';
   if (r.habilidadesNovas.length > 0) {
     h += '<div class="rpg-novas"><strong>✨ Novas habilidades desbloqueadas:</strong><ul>' +
       r.habilidadesNovas.map(function(id){ return '<li>' + HABILIDADES[id].emoji + ' ' + esc(HABILIDADES[id].nome) + '</li>'; }).join('') + '</ul></div>';
   }
   if (r.capituloConcluido) h += '<p class="rpg-cap-fim">🎉 Capítulo concluído! O próximo já abriu no mapa.</p>';
   h += '<button type="button" class="rpg-btn grande" onclick="aposResultado()">Continuar →</button>';
   h += '</section>';
   return h;
 }

 function fimHTML() {
   let h = '<section class="rpg-card rpg-fim">';
   h += '<div class="rpg-fim-emoji">🏆🐻</div>';
   h += '<h2 class="rpg-h2">Você completou a jornada, ' + esc(estado.nome) + '!</h2>';
   h += '<p>Você atravessou um dia inteiro de desafios — do barulho da cantina até falar na frente da turma. Cada escolha foi sua. Isso é coragem de verdade.</p>';
   h += '<p class="rpg-muted">Chegou ao nível <strong>' + estado.nivel + '</strong> e juntou <strong>' + estado.itens.length + '</strong> itens de apoio pelo caminho.</p>';
   h += '<div class="rpg-fim-btns"><button type="button" class="rpg-btn" onclick="irMapa()">🗺️ Revisitar capítulos</button>' +
     '<button type="button" class="rpg-btn-ghost" onclick="recomecar()">↺ Nova jornada</button></div>';
   h += '</section>';
   return h;
 }

 function renderModalPausa() {
   let overlay = document.getElementById('rpg-pausa');
   if (pausa) {
     if (!overlay) {
       overlay = document.createElement('div');
       overlay.id = 'rpg-pausa';
       overlay.className = 'rpg-modal-overlay';
       overlay.innerHTML = '<div class="rpg-modal"><div class="rpg-modal-emoji">🫧</div>' +
         '<h2 class="rpg-h2">Vamos respirar juntos</h2>' +
         '<p>Sua Calma ficou baixinha — e tudo bem. Isso não é perder. Vamos fazer uma pausa: inspira devagar… segura… e solta. Quando estiver pronto, a gente continua exatamente de onde parou.</p>' +
         '<button type="button" class="rpg-btn grande" onclick="respirarNaPausa()">Respirei. Vamos continuar 💙</button></div>';
       document.body.appendChild(overlay);
     }
   } else if (overlay) {
     overlay.remove();
   }
 }

 /* ============ ENRIQUECIMENTO POR IA ============ */
 async function enriquecer(m, nome) {
   narracaoIA = null;
   if (!enrich || !m.enriquecerIA) return;
   carregandoIA = true; render();
   try {
     const sys = 'Você é o Theo, um urso narrador gentil de um RPG para adolescentes autistas. ' +
       'Reescreva a narração da cena de forma um pouco mais detalhada e calorosa, mantendo linguagem LITERAL ' +
       '(sem ironia, metáfora ou ambiguidade), em no máximo 3 frases. NUNCA invente fatos novos, personagens ou ações — ' +
       'apenas descreva com mais cor o que já está na narração. Português brasileiro, 2ª pessoa, tom acolhedor. ' +
       'Responda só com a narração, sem aspas nem comentários.';
     const txt = await chamarGroq(sys, [{ role:'user', content:
       'Cena: ' + m.titulo + (m.personagem ? (' (com ' + m.personagem + ')') : '') +
       '\nNome do jogador: ' + nome + '\nNarração base: ' + m.narracao }], 220);
     if (txt) narracaoIA = txt.replace(/^[\s"']+|[\s"']+$/g, '').trim();
   } catch(x) { /* mantém narração fixa */ }
   finally { carregandoIA = false; render(); }
 }

 /* ============ AÇÕES ============ */
 function iniciarCena(e) {
   progresso = 0; cenaXp = 0; log = []; escolhasFeitas = []; resultado = null; narracaoIA = null;
   vista = 'cena'; render();
   const m = CAPITULOS[e.capituloIdx].momentos[e.momentoIdx];
   enriquecer(m, e.nome);
 }
 function escolherClasse(classeId) {
   const inp = document.getElementById('rpg-nome');
   const nome = inp ? inp.value : nomeInput;
   setEstado(criarEstado(classeId, nome || 'herói'));
   vista = 'mapa'; render();
 }
 function abrirCapitulo(idx) {
   if (!estado || !capituloLiberado(estado, idx)) return;
   const e = irParaCapitulo(estado, idx);
   setEstado(e); iniciarCena(e);
 }
 function continuar() { if (estado) iniciarCena(estado); }
 function irMapa() { vista = 'mapa'; render(); }

 function finalizarMomento(estadoComCalma, xpTotal) {
   const r = ganharXp(estadoComCalma, xpTotal);
   let novo = r.estado;
   const item = sortearItem();
   if (item) novo = aplicarItem(novo, item);
   const capAntes = novo.capituloIdx;
   const avancado = avancarPosicao(novo);
   const capituloConcluido = avancado.capituloIdx !== capAntes;
   setEstado(avancado);
   resultado = { xpGanho:xpTotal, subiuNivel:r.subiuNivel, novosNiveis:r.novosNiveis, habilidadesNovas:r.habilidadesNovas, item:item, capituloConcluido:capituloConcluido };
   vista = 'resultado'; render();
 }

 function onEscolha(id) {
   if (escolhasFeitas.includes(id)) return;
   const m = momentoAtual();
   const e = m.escolhas.find(function(x){ return x.id === id; });
   if (!e) return;
   escolhasFeitas.push(id);
   const novoProgresso = Math.min(m.meta, progresso + e.progresso);
   const estadoCalma = ajustarCalma(estado, e.calma);
   setEstado(estadoCalma);
   progresso = novoProgresso;
   cenaXp += e.xp;
   log.push(e.feedback);
   if (estadoCalma.calma <= 0) { pausa = true; render(); return; }
   render();
   if (novoProgresso >= m.meta) {
     const xpFinal = cenaXp;
     setTimeout(function(){ finalizarMomento(estadoCalma, xpFinal); }, 650);
   }
 }

 function onHabilidade(id) {
   if (!estado || usosRestantes(estado, id) <= 0) return;
   const m = momentoAtual();
   const hab = HABILIDADES[id];
   let e = usarHabilidade(estado, id);
   const novoProgresso = Math.min(m.meta, progresso + hab.progresso);
   e = ajustarCalma(e, hab.calma);
   setEstado(e);
   progresso = novoProgresso;
   log.push(hab.fala);
   render();
   if (novoProgresso >= m.meta) {
     const xpFinal = cenaXp;
     setTimeout(function(){ finalizarMomento(e, xpFinal); }, 650);
   }
 }

 function respirarNaPausa() {
   if (!estado) return;
   const alvo = Math.round(estado.calmaMax * 0.45);
   setEstado(ajustarCalma(estado, alvo));
   log.push('Vocês respiram juntos. Tudo bem precisar de uma pausa. Você pode continuar.');
   pausa = false; render();
 }

 function aposResultado() {
   if (!estado) return;
   if (jogoCompleto(estado)) { vista = 'fim'; render(); }
   else if (resultado && resultado.capituloConcluido) { vista = 'mapa'; render(); }
   else { iniciarCena(estado); }
 }

 function recomecar() {
   if (!confirm('Começar uma nova jornada? Seu progresso atual será apagado.')) return;
   apagarSave();
   estado = null;
   nomeInput = nomeUsuario || '';
   vista = 'classe'; render();
 }

 function toggleEnrich() {
   enrich = !enrich;
   try { localStorage.setItem(ENRICH_KEY, enrich ? '1' : '0'); } catch(x){}
   render();
 }

 async function sairDaConta() { if (sb) await sb.auth.signOut(); window.location.href = 'login.html'; }

 /* ============ INICIALIZAÇÃO ============ */
 async function iniciarPagina() {
   try { enrich = localStorage.getItem(ENRICH_KEY) === '1'; } catch(x){}

   if (sb) {
     const { data:{ session } } = await sb.auth.getSession();
     if (!session) { window.location.href = 'login.html'; return; }
     const { data: perfil } = await sb.from('profiles').select('nome, tipo').eq('id', session.user.id).single();
     if (perfil) {
       nomeUsuario = perfil.nome || 'amigo';
       const elNome = document.getElementById('nav-user-name');
       if (elNome) elNome.textContent = nomeUsuario;
       if (perfil.tipo === 'responsavel') { window.location.href = 'home-cuidador.html'; return; }
     }
   }
   nomeInput = nomeUsuario;

   const salvo = carregar();
   if (salvo) { estado = salvo; vista = 'mapa'; }
   else { vista = 'classe'; }
   render();
 }

 iniciarPagina();
 </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiTEA — Painel do Cuidador</title>
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lumitea.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/enhance.css"><!--lt-enhance-->

  <script>
  /* Compatibilidade com os links antigos (home-cuidador.html?tela=humor etc.).
     Cada aba virou uma página própria; quem tiver o link velho salvo, ou um
     favorito, cai na página certa em vez de numa aba que não existe mais.
     Roda antes de tudo, ainda no <head>, pra não montar a tela à toa. */
  (function () {
    var mapa = {
      alertas:      'alertas-cuidador.html',
      live:         'live-cuidador.html',
      humor:        'humor-cuidador.html',
      relatorio:    'relatorios-cuidador.html',
      relatorios:   'relatorios-cuidador.html',
      observacoes:  'observacoes-cuidador.html',
      progresso:    'progresso-cuidador.html',
      estatisticas: 'estatisticas-cuidador.html',
      chat:         'consultoria-cuidador.html',
      consultoria:  'consultoria-cuidador.html'
    };
    try {
      var tela = new URLSearchParams(window.location.search).get('tela');
      if (tela && mapa[tela]) window.location.replace(mapa[tela]);
    } catch (e) {}
  })();
  </script>

  <script src="js/core/icons.js" defer></script>
  <script src="js/core/reveal.js" defer></script>
  <script src="js/core/ui.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/core/secrets.js"></script>
  <script src="js/core/config.js"></script>
  <!-- SEM defer de propósito: o bloco de script no fim do body desta página roda
       durante o parse e já usa CUI. Com defer, a casca só existiria depois. -->
  <script src="js/core/cuidador-shell.js"></script>
</head>
<body class="app-body lt-pro cui-page" data-cui-pagina="painel" data-cui-teen="1">

  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Topo mobile, gaveta, faixa de alerta urgente, sidebar e barra do
       num arquivo só, então mudar lá muda em todas as páginas do cuidador. -->
  <!-- Topo mobile, gaveta, faixa de alerta urgente, sidebar e barra do adolescente vêm da casca:
       js/core/cuidador-shell.js (o menu vive num arquivo só). -->
  <div class="cui-layout">
    <div class="cui-main">

      <div class="cui-tela ativa">

        <div class="cui-welcome-hero lt-reveal" id="cui-welcome-hero">
          <div class="cui-welcome-av">
            <img src="img/urso67.png" alt="Lumi">
          </div>
          <div class="cui-welcome-text">
            <h2>Olá, <span id="cui-welcome-nome">cuidador</span></h2>
            <p id="cui-welcome-sub">A Lumi está acompanhando e pronta para ajudar.</p>
            <div class="cui-welcome-badges">
              <span><i class="lt-i" data-lt-icon="radio" aria-hidden="true"></i> Monitoramento ativo</span>
              <span id="wb-alerta-cnt" class="cui-badge-alerta" hidden></span>
              <span id="wb-teen-nome">Selecione um adolescente</span>
            </div>
          </div>
          <div class="cui-welcome-acoes">
            <a class="btn-secondary btn-sm" href="alertas-cuidador.html"><i class="lt-i" data-lt-icon="bell" aria-hidden="true"></i> Ver alertas</a>
            <a class="btn-primary btn-sm" href="consultoria-cuidador.html"><i class="lt-i" data-lt-icon="message-circle" aria-hidden="true"></i> Falar com a Lumi</a>
          </div>
        </div>

        <div class="cui-stats-grid lt-reveal" id="painel-stats">
          <div class="cui-stat"><div class="cui-stat-icon"><i class="lt-i" data-lt-icon="user" aria-hidden="true"></i></div><div class="cui-stat-val">—</div><div class="cui-stat-label">Selecione um adolescente</div></div>
        </div>

        <div class="cui-alertas-card lt-reveal">
          <h3><i class="lt-i" data-lt-icon="bell" aria-hidden="true"></i> Alertas recentes</h3>
          <div id="painel-alertas-lista"><p class="cui-hint">Selecione um adolescente para ver os alertas.</p></div>
        </div>

        <div class="cui-humor-chart lt-reveal">
          <h3><i class="lt-i" data-lt-icon="bar-chart" aria-hidden="true"></i> Humor — últimos 7 dias</h3>
          <div class="humor-bars" id="humor-chart-bars">
            <p class="cui-hint">Selecione um adolescente para ver o humor.</p>
          </div>
        </div>

      </div>

    </div><!-- /cui-main -->
  </div><!-- /cui-layout -->

  <script>
    /* Painel geral: só resumo. Cada área do acompanhamento virou uma página
       própria (alertas-, live-, humor-, relatorios-, observacoes-,
       progresso-, estatisticas-, consultoria-cuidador.html). */

    function saudacao() {
      var nome = (CUI.perfil && CUI.perfil.nome) ? CUI.perfil.nome.split(' ')[0] : 'cuidador';
      document.getElementById('cui-welcome-nome').textContent = nome;
    }

    async function carregarPainel(teenId) {
      saudacao();

      var stats = document.getElementById('painel-stats');
      var badgeTeen = document.getElementById('wb-teen-nome');
      var listaAlertas = document.getElementById('painel-alertas-lista');
      var barras = document.getElementById('humor-chart-bars');

      if (!teenId) {
        badgeTeen.textContent = CUI.teens.length ? 'Selecione um adolescente' : 'Nenhum adolescente vinculado';
        stats.innerHTML = '<div class="cui-stat"><div class="cui-stat-icon">' + CUI.ic('user') + '</div><div class="cui-stat-val">—</div><div class="cui-stat-label">Selecione um adolescente</div></div>';
        listaAlertas.innerHTML = '<p class="cui-hint">Selecione um adolescente para ver os alertas.</p>';
        barras.innerHTML = '<p class="cui-hint">Selecione um adolescente para ver o humor.</p>';
        document.getElementById('wb-alerta-cnt').hidden = true;
        return;
      }

      var teen = CUI.teen();
      badgeTeen.innerHTML = CUI.ic('user') + ' ' + CUI.esc(teen ? teen.nome : '');

      /* XP/nível direto do banco: o cache da casca é do carregamento da página
         e o adolescente pode ter ganhado XP nos jogos desde então. */
      var nd = await CUI.sb.from('neurodivergente').select('xp, nivel').eq('id', teenId).single();
      var xp = (nd.data && nd.data.xp) || 0;
      var nivel = (nd.data && nd.data.nivel) || 1;

      var hum = await CUI.sb.from('humores').select('nivel, timestamp')
        .eq('id_neurodivergente', teenId)
        .order('timestamp', { ascending: false }).limit(30);
      var humores = hum.data || [];

      var hoje = new Date().toISOString().slice(0, 10);
      var deHoje = humores.filter(function (h) { return (h.timestamp || '').slice(0, 10) === hoje; });
      var humorHoje = deHoje.length ? CUI.humorChip(deHoje[0].nivel) : '—';
      var med7 = CUI.calcMediaHumor(humores, 7);

      stats.innerHTML =
        CUI.cuiStat('star', 'XP total', xp.toLocaleString('pt-BR')) +
        CUI.cuiStat('target', 'Nível', nivel) +
        CUI.cuiStat('heart', 'Humor hoje', humorHoje) +
        CUI.cuiStat('bar-chart', 'Humor (7d)', med7 ? med7.toFixed(1) + '/5' : '—');

      if (humores.length) {
        CUI.renderHumorBars(humores, 'humor-chart-bars');
        var chip = document.getElementById('teen-humor-current');
        if (chip) { chip.hidden = false; chip.innerHTML = 'Humor: ' + CUI.humorChip(humores[0].nivel); }
      } else {
        barras.innerHTML = '<p class="cui-hint">Nenhum registro de humor ainda.</p>';
      }

      await carregarAlertasResumo(teenId);
    }

    async function carregarAlertasResumo(teenId) {
      var el = document.getElementById('painel-alertas-lista');
      var wb = document.getElementById('wb-alerta-cnt');
      if (!el) return;

      var res = await CUI.sb.from('alertas').select('*')
        .eq('id_neurodivergente', teenId)
        .order('timestamp', { ascending: false }).limit(3);

      if (res.error) {
        el.innerHTML = '<p class="cui-hint">Não foi possível carregar os alertas agora.</p>';
        return;
      }

      var alertas = res.data || [];
      var naoLidos = alertas.filter(function (a) { return !a.lido; }).length;
      if (wb) {
        wb.hidden = naoLidos === 0;
        wb.innerHTML = CUI.ic('bell') + ' ' + naoLidos + ' alerta' + (naoLidos > 1 ? 's' : '');
      }

      if (!alertas.length) {
        el.innerHTML = '<p class="cui-hint">Nenhum alerta registrado. Tudo em ordem.</p>';
        return;
      }

      el.innerHTML = alertas.map(function (a) {
        var data = a.timestamp ? new Date(a.timestamp).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        return '<div class="alerta-item ' + (a.tipo || 'info') + (a.lido ? ' lido' : '') + '">' +
                 '<div class="alerta-icon">' + CUI.alertaIcone(a.tipo) + '</div>' +
                 '<div class="alerta-info"><label>' + data + '</label><p>' + CUI.esc(a.titulo || 'Alerta') + '</p></div>' +
               '</div>';
      }).join('');
    }

    CUI.aoTrocarTeen(carregarPainel);

    /* Atualiza sozinho a cada 30s, como o painel antigo fazia. */
    setInterval(function () { if (CUI.pronto && CUI.teenId) carregarPainel(CUI.teenId); }, 30000);
  </script>
</body>
</html>
